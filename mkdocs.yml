site_name: Veritas Corporate — Multi-Agent System
site_description: >
  LangGraph multi-agent system for corporate travel & expense compliance auditing.
  Researcher → Planner → Operator → Writer pipeline with HITL approval.
site_author: Veritas Corporate Engineering
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep-purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep-purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Agent Pipeline: architecture/pipeline.md
      - State & Checkpointing: architecture/state.md
  - API Reference:
      - Domain Models: api/domain.md
      - Agent Interfaces: api/interfaces.md
      - Agent Registry: api/registry.md
      - Workflow Graph: api/graph.md
      - Orchestrator (Service): api/service.md
      - REST API: api/rest.md
      - Infrastructure: api/infrastructure.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Configuration: guides/configuration.md
      - Adding an Agent: guides/new-agent.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
